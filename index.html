<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Meesho Template Selector</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding-bottom:100px;
}

.header{
position:sticky;
top:0;
background:white;
padding:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
z-index:100;
text-align:center;
}

.status{
font-size:16px;
font-weight:bold;
}

.gallery{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
padding:10px;
}

.card{
position:relative;
cursor:pointer;
}

.card img{
width:100%;
border-radius:12px;
display:block;
}

.template-label{
position:absolute;
top:8px;
left:8px;
background:black;
color:white;
padding:4px 8px;
border-radius:8px;
font-size:12px;
}

.selected{
outline:4px solid #ff4fa3;
border-radius:12px;
}

.footer{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
padding:10px;
box-shadow:0 -2px 10px rgba(0,0,0,.1);
}

.body-types{
display:flex;
gap:6px;
overflow-x:auto;
margin-bottom:8px;
}

.body-types button{
border:none;
padding:10px;
border-radius:10px;
background:#eee;
white-space:nowrap;
}

.body-types button.active{
background:#ff4fa3;
color:white;
}

.copy-btn{
width:100%;
padding:12px;
border:none;
background:#111;
color:white;
border-radius:10px;
font-size:16px;
}

#lightbox{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.95);
z-index:999;
justify-content:center;
align-items:center;
}

#lightbox img{
width:95%;
max-height:95%;
object-fit:contain;
}

</style>
</head>

<body>

<div class="header">
<div class="status" id="status">
Template 1 | B1
</div>
</div>

<div class="gallery" id="gallery"></div>

<div id="lightbox" onclick="closePreview()">
<img id="previewImage">
</div>

<div class="footer">

<div class="body-types">

<button class="active" onclick="setBodyType('B1',this)">
B1 Lean
</button>

<button onclick="setBodyType('B2',this)">
B2 Lean + Big Bust
</button>

<button onclick="setBodyType('B3',this)">
B3 Soft Curvy
</button>

<button onclick="setBodyType('B4',this)">
B4 Thick & Curvy
</button>

</div>

<button class="copy-btn" onclick="copySelection()">
Copy Selection
</button>

</div>

<script>

let selectedTemplate=1;
let selectedBodyType="B1";

const gallery=document.getElementById("gallery");

for(let i=1;i<=11;i++){

const card=document.createElement("div");
card.className="card";

if(i===1){
card.classList.add("selected");
}

card.innerHTML=`
<div class="template-label">
Template ${i}
</div>

<img src="template ${i}.png"
onclick="openPreview('template ${i}.png')">
`;

card.onclick=()=>selectTemplate(i,card);

gallery.appendChild(card);
}

function selectTemplate(id,card){

selectedTemplate=id;

document
.querySelectorAll(".card")
.forEach(c=>c.classList.remove("selected"));

card.classList.add("selected");

updateStatus();
}

function setBodyType(type,btn){

selectedBodyType=type;

document
.querySelectorAll(".body-types button")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

updateStatus();
}

function updateStatus(){

document.getElementById("status").innerText=
`Template ${selectedTemplate} | ${selectedBodyType}`;
}

function openPreview(src){

document.getElementById("previewImage").src=src;

document.getElementById("lightbox").style.display="flex";
}

function closePreview(){

document.getElementById("lightbox").style.display="none";
}

function copySelection(){

const text=
`Template=${selectedTemplate}
BodyType=${selectedBodyType}`;

navigator.clipboard.writeText(text);

alert("Copied:\\n\\n"+text);
}

</script>

</body>
</html>
